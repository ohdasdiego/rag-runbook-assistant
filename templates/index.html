<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Runbook Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <h1>Runbook Assistant</h1>
            </div>
            <div class="stats">
                <span class="stat-badge"><span id="doc-count">{{ doc_count }}</span> runbooks indexed</span>
                <span class="stat-badge status-badge">● Online</span>
            </div>
        </header>

        <main>
            <div class="intro">
                <h2>Ask anything about your runbooks</h2>
                <p>Retrieval-augmented generation powered by ChromaDB and Claude. All answers cite their source.</p>
            </div>

            <div class="query-box">
                <textarea
                    id="question"
                    placeholder="e.g. How do I restart the ingestion pipeline if it's stuck?"
                    rows="3"
                ></textarea>
                <button id="ask-btn" onclick="askQuestion()">
                    <span class="btn-text">Ask</span>
                    <span class="btn-spinner" style="display:none;">⟳</span>
                </button>
            </div>

            <div class="examples">
                <span class="example-label">Try:</span>
                <button class="example-chip" onclick="setQuestion(this)">How do I respond to a high CPU alert?</button>
                <button class="example-chip" onclick="setQuestion(this)">What's the escalation path for a P1 incident?</button>
                <button class="example-chip" onclick="setQuestion(this)">How do I rotate a leaked API key?</button>
            </div>

            <div id="result" class="result-area" style="display:none;"></div>
        </main>

        <footer>
            <p>Built with ChromaDB · sentence-transformers · Claude API</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
